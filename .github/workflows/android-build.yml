name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            tmp="$(mktemp -d)"
            flutter create "$tmp/app" --platforms=android --project-name apphaspa --org com.example
            cp -R "$tmp/app/android" ./android
          fi
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
